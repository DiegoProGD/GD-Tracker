<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GD Progress Tracker</title>

<style>

body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1f2937;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

#hardest{
    font-size:24px;
    font-weight:bold;
}

.controls{
    display:flex;
    gap:10px;
}

button{
    border:none;
    border-radius:8px;
    padding:10px 15px;
    cursor:pointer;
    font-weight:bold;
}

.addBtn{
    background:#22c55e;
    color:white;
}

.copyBtn{
    background:#3b82f6;
    color:white;
}

.moveBtn{
    background:#8b5cf6;
    color:white;
    width:100%;
    margin-top:5px;
}

.deleteBtn{
    background:#dc2626;
    color:white;
    width:100%;
    margin-top:5px;
}

#levels{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:#1f2937;
    border-radius:15px;
    overflow:hidden;
}

.green{
    border:4px solid #22c55e;
}

.yellow{
    border:4px solid #eab308;
}

.red{
    border:4px solid #ef4444;
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.content{
    padding:15px;
}

.levelName{
    font-size:24px;
    margin-bottom:10px;
}

.best{
    margin-bottom:10px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:8px;
    border:none;
    border-radius:6px;
    margin-bottom:8px;
}

</style>
</head>
<body>

<header>

<div id="hardest">
🏆 Hardest Completed: None
</div>

<div class="controls">

<button class="addBtn"
onclick="addLevel()">
➕ Add Level
</button>

<button class="copyBtn"
onclick="copyProgress()">
📋 Copy Progress
</button>

</div>

</header>

<div id="levels"></div>

<script>

let levels =
JSON.parse(
localStorage.getItem("gdLevels")
) || [];

function save(){

    localStorage.setItem(
        "gdLevels",
        JSON.stringify(levels)
    );

}

function addLevel(){

    levels.push({
        name:"New Level",
        best:0,
        image:"https://picsum.photos/600/300?random="+Math.random()
    });

    save();
    render();

}

function deleteLevel(index){

    levels.splice(index,1);

    save();
    render();

}

function updateName(index,value){

    levels[index].name = value;

    save();
    render();

}

function updateBest(index,value){

    value = Number(value);

    if(value < 0) value = 0;
    if(value > 100) value = 100;

    levels[index].best = value;

    save();
    render();

}

function updateImage(event,index){

    const file =
    event.target.files[0];

    if(!file) return;

    const reader =
    new FileReader();

    reader.onload = function(e){

        levels[index].image =
        e.target.result;

        save();
        render();

    };

    reader.readAsDataURL(file);

}

function moveLevel(index){

    let pos = prompt(
        "Move level to what position?\n\n1 = hardest\n2 = second hardest\netc."
    );

    if(pos === null) return;

    pos = parseInt(pos);

    if(
        isNaN(pos) ||
        pos < 1 ||
        pos > levels.length
    ){
        alert("Invalid position.");
        return;
    }

    const item =
    levels.splice(index,1)[0];

    levels.splice(
        pos-1,
        0,
        item
    );

    save();
    render();

}

function getColor(best){

    best = Number(best);

    if(best >= 100)
        return "green";

    if(best >= 50)
        return "yellow";

    return "red";

}

function getEmoji(best){

    best = Number(best);

    if(best >= 100)
        return "✅";

    if(best >= 50)
        return "🟨";

    return "🟥";

}

function updateHardest(){

    const hardest =
    document.getElementById(
        "hardest"
    );

    const completed =
    levels.filter(level =>
        Number(level.best) >= 100
    );

    if(completed.length === 0){

        hardest.textContent =
        "🏆 Hardest Completed: None";

        return;

    }

    hardest.textContent =
    "🏆 Hardest Completed: " +
    completed[0].name;

}

function copyProgress(){

    let text = "";

    const completed =
    levels.filter(level =>
        Number(level.best) >= 100
    );

    if(completed.length > 0){

        text +=
        "🏆 Hardest Completed: " +
        completed[0].name +
        "\n\n";

    }

    levels.forEach(level => {

        text +=
        `${level.best}% ${getEmoji(level.best)} ${level.name}\n`;

    });

    navigator.clipboard
    .writeText(text);

    alert("Copied!");

}

function render(){

    updateHardest();

    const container =
    document.getElementById(
        "levels"
    );

    container.innerHTML = "";

    levels.forEach((level,index)=>{

        const complete =
        Number(level.best) >= 100
        ? " ✅"
        : "";

        const card =
        document.createElement("div");

        card.className =
        "card " +
        getColor(level.best);

        card.innerHTML = `

        <img src="${level.image}">

        <div class="content">

            <div class="levelName">
                ${getEmoji(level.best)}
                ${level.name}${complete}
            </div>

            <div class="best">
                Best: ${level.best}%
            </div>

            <input
            value="${level.name}"
            onchange="
            updateName(
            ${index},
            this.value
            )">

            <input
            type="number"
            min="0"
            max="100"
            value="${level.best}"
            onchange="
            updateBest(
            ${index},
            this.value
            )">

            <input
            type="file"
            accept="image/*"
            onchange="
            updateImage(
            event,
            ${index}
            )">

            <button
            class="moveBtn"
            onclick="
            moveLevel(
            ${index}
            )">
            📌 Move Position
            </button>

            <button
            class="deleteBtn"
            onclick="
            deleteLevel(
            ${index}
            )">
            🗑 Delete
            </button>

        </div>

        `;

        container.appendChild(card);

    });

}

render();

</script>

</body>
</html>
