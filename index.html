<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GD Progress Tracker</title>

<style>
body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1f2937;
    padding:15px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
}

#hardest{
    font-size:24px;
    font-weight:bold;
}

.controls{
    display:flex;
    gap:8px;
}

button{
    border:none;
    border-radius:8px;
    padding:10px 15px;
    font-weight:bold;
    cursor:pointer;
}

.add{
    background:#22c55e;
    color:white;
}

.copy{
    background:#3b82f6;
    color:white;
}

#levels{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:#1f2937;
    border-radius:15px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.content{
    padding:15px;
}

.green{
    border:4px solid #22c55e;
}

.yellow{
    border:4px solid #eab308;
}

.red{
    border:4px solid #ef4444;
}

.levelName{
    font-size:24px;
    margin-bottom:10px;
}

.best{
    font-size:18px;
    margin-bottom:10px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:8px;
    border:none;
    border-radius:6px;
    margin:5px 0;
}

.moveBtn{
    background:#8b5cf6;
    color:white;
    margin-top:5px;
}

.deleteBtn{
    background:#dc2626;
    color:white;
    margin-top:5px;
}
</style>
</head>

<body>

<header>

<div id="hardest">
🏆 Hardest: None
</div>

<div class="controls">
<button class="add" onclick="addLevel()">➕ Add Level</button>
<button class="copy" onclick="copyProgress()">📋 Copy Progress</button>
</div>

</header>

<div id="levels"></div>

<script>

let levels =
JSON.parse(localStorage.getItem("gdLevels"))
|| [];

function save(){
    localStorage.setItem(
        "gdLevels",
        JSON.stringify(levels)
    );
}

function getClass(best){

    best = Number(best);

    if(best >= 100) return "green";
    if(best >= 50) return "yellow";

    return "red";
}

function getEmoji(best){

    best = Number(best);

    if(best >= 100) return "✅";
    if(best >= 50) return "🟨";

    return "🟥";
}

function addLevel(){

    levels.push({
        name:"New Level",
        best:0,
        image:"https://picsum.photos/600/300?random=" + Math.random()
    });

    save();
    render();
}

function deleteLevel(i){

    levels.splice(i,1);

    save();
    render();
}

function updateName(i,val){

    levels[i].name = val;

    save();
    render();
}

function updateBest(i,val){

    val = Number(val);

    if(val < 0) val = 0;
    if(val > 100) val = 100;

    levels[i].best = val;

    save();
    render();
}

function updateImage(event,i){

    const file =
    event.target.files[0];

    if(!file) return;

    const reader =
    new FileReader();

    reader.onload = function(e){

        levels[i].image =
        e.target.result;

        save();
        render();
    }

    reader.readAsDataURL(file);
}

function moveLevel(i){

    let pos = prompt(
        "Move to position number:\n1 = hardest"
    );

    if(pos === null) return;

    pos = parseInt(pos);

    if(
        isNaN(pos) ||
        pos < 1 ||
        pos > levels.length
    ){
        alert("Invalid position");
        return;
    }

    const level =
    levels.splice(i,1)[0];

    levels.splice(pos-1,0,level);

    save();
    render();
}

function copyProgress(){

    let text = "";

    if(levels.length > 0){
        text +=
        "🏆 Hardest: " +
        levels[0].name +
        "\n\n";
    }

    levels.forEach(level=>{

        text +=
        `${level.best}% ${getEmoji(level.best)} ${level.name}\n`;

    });

    navigator.clipboard.writeText(text);

    alert("Copied!");
}

function updateHardest(){

    const hardest =
    document.getElementById("hardest");

    if(levels.length === 0){

        hardest.textContent =
        "🏆 Hardest: None";

        return;
    }

    hardest.textContent =
    "🏆 Hardest: " +
    levels[0].name;
}

function render(){

    updateHardest();

    const container =
    document.getElementById("levels");

    container.innerHTML = "";

    levels.forEach((level,i)=>{

        const card =
        document.createElement("div");

        card.className =
        "card " +
        getClass(level.best);

        card.innerHTML = `

        <img src="${level.image}">

        <div class="content">

        <div class="levelName">
        ${getEmoji(level.best)}
        ${level.name}
        ${Number(level.best) >= 100 ? "✅" : ""}
        </div>

        <div class="best">
        Best: ${level.best}%
        </div>

        <input
        value="${level.name}"
        onchange="updateName(${i},this.value)">

        <input
        type="number"
        min="0"
        max="100"
        value="${level.best}"
        onchange="updateBest(${i},this.value)">

        <input
        type="file"
        accept="image/*"
        onchange="updateImage(event,${i})">

        <button
        class="moveBtn"
        onclick="moveLevel(${i})">
        📌 Move Position
        </button>

        <button
        class="deleteBtn"
        onclick="deleteLevel(${i})">
        🗑 Delete
        </button>

        </div>
        `;

        container.appendChild(card);

    });
}

render();

</script>
</body>
</html>
